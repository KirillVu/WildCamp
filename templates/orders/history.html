{% extends "base.html" %}{% block content %}<section class="section container"><h1>История заказов</h1>{% for order in orders %}<a class="order-row" href="{% url 'order_detail' order.pk %}"><strong>Заказ №{{ order.pk }}</strong><span>{{ order.get_status_display }}</span><span>{{ order.total_price }} ₽</span></a>{% empty %}<p>Заказов пока нет.</p>{% endfor %}</section>{% endblock %}
